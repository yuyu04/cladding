id: F-6aebb9
slug: headroom-compression-seam
title: "Headroom context-compression seam (dark launch · native in-process compressor)"
status: done
modules:
  - src/optimizer/headroom.ts
  - src/optimizer/compress-native.ts
  - src/optimizer/compress-types.ts
  - src/optimizer/profiles.ts
  - src/adapters/sdk/anthropic.ts
  - src/events/log.ts
acceptance_criteria:
  - id: AC-ac034f
    ears: state
    condition: "while Headroom is disabled (CLADDING_HEADROOM unset or 'off')"
    action: "return the original messages unchanged with applied=false and fallbackReason='disabled'"
    response: "src/optimizer/headroom.ts compressContext() reads CLADDING_HEADROOM via enabled(); when off it returns {messages, applied:false, fallbackReason:'disabled'} without running any compression pass — zero behavior change for the existing dispatch path"
    text: "While Headroom is disabled, the system shall return the original messages unchanged so the harness behaves identically to a no-Headroom install."
    test_refs: ["tests/optimizer/headroom.test.ts"]
  - id: AC-f408c8
    ears: ubiquitous
    action: "perform compression natively in-process with no subprocess, no server, no proxy, and no external engine to install"
    response: "src/optimizer/compress-native.ts compressNative() is pure TypeScript that ships inside the cladding npm package; it runs in the harness process with zero runtime dependencies, so compression is active wherever cladding is installed (no Python, no Rust extension, no daemon)"
    text: "The system shall perform compression natively in-process, requiring no external engine, subprocess, server, or proxy."
    test_refs: ["tests/optimizer/compress-native.test.ts"]
  - id: AC-c71d04
    ears: event
    condition: "when Headroom is on and a payload contains bulky repetitive machine output (a large JSON array or repetitive log lines) above the min-token gate"
    action: "deterministically dedup it (json_dedup / log_dedup), returning applied=true with tokensSaved>0 and the transform names"
    response: "src/optimizer/compress-native.ts collapses near-identical JSON-array objects (keeping exemplars + a summary marker) and runs of pattern-identical log lines; compressContext() returns {applied:true, result} with transformsApplied including 'native:json_dedup' or 'native:log_dedup'"
    text: "When the payload is bulky repetitive machine output, the system shall deterministically compress it and report the realized savings."
    test_refs: ["tests/optimizer/headroom.test.ts", "tests/optimizer/compress-native.test.ts"]
  - id: AC-ca3e88
    ears: state
    condition: "while a payload is high-value prose protected by its profile (system/user messages, recent turns, or fenced code under the spec/code profiles)"
    action: "leave it untouched by the LOSSY tier and return the original messages with fallbackReason='no_savings' when no lossless gain exists"
    response: "src/optimizer/compress-native.ts isEligible() honors compress_system_messages / compress_user_messages / protect_recent / protect_analysis_context; the lossy tier (json_dedup/log_dedup) never runs on protected payloads, so a feature shard, source file under review, or the active ask is never mangled — pure prose yields no savings and returns the ORIGINAL message reference"
    text: "While a payload is protected prose, the system shall not apply the lossy tier to it."
    test_refs: ["tests/optimizer/headroom.test.ts", "tests/optimizer/compress-native.test.ts"]
  - id: AC-7e2c91
    ears: ubiquitous
    action: "additionally apply a LOSSLESS tier (json_minify: strip JSON pretty-print whitespace; ws_collapse: fold 3+ blank lines to one) that preserves meaning, so it may run even on content the lossy tier protects — EXCEPT system messages, which stay byte-identical to keep the cached persona prefix stable"
    response: "src/optimizer/compress-native.ts losslessNormalize() runs json_minify + collapseBlankLines on every non-system message after the lossy tier; both are semantics-preserving (JSON.parse round-trips equal; blank-line count beyond one is non-semantic), so they broaden coverage at ~zero risk; the system message is skipped so its bytes (and the prompt-cache key) never change"
    text: "The system shall apply meaning-preserving lossless transforms to non-system messages, even when the lossy tier protects them."
    test_refs: ["tests/optimizer/compress-native.test.ts"]
  - id: AC-9f23a1
    ears: state
    condition: "while CLADDING_HEADROOM='simulate'"
    action: "compute the predicted savings but DO NOT apply them — return the original messages with applied=false and fallbackReason='simulate'"
    response: "src/optimizer/headroom.ts simulating() gates the apply step; in simulate mode compressContext() runs compressNative() and returns its result (so telemetry logs the predicted tokensSaved) but sends the ORIGINAL payload — a zero-risk dry run for measuring savings before promotion"
    text: "While Headroom is in simulate mode, the system shall predict savings without applying them."
    test_refs: ["tests/optimizer/headroom.test.ts"]
  - id: AC-a17c3e
    ears: state
    condition: "while CLADDING_HEADROOM='auto'"
    action: "apply compression like 'on', then let the dispatch adapter detect (deterministically, no LLM) whether the model reply signals it needed the omitted data"
    response: "src/optimizer/headroom.ts headroomMode() recognizes 'auto' (enabled like 'on'); needsFullContext(reply) is a pure regex over insufficiency signals (EN+KO, plus the compressor's own markers); shouldRecover(applied, reply) is true only when mode is auto AND compression was applied AND the reply signals a gap"
    text: "While Headroom is in auto mode, the system shall apply compression and deterministically detect whether the reply signals missing context."
    test_refs: ["tests/optimizer/headroom.test.ts"]
  - id: AC-d4f5b2
    ears: event
    condition: "when auto mode applied compression and the reply signals it needed the omitted data"
    action: "re-dispatch that one turn with the ORIGINAL uncompressed payload (bounded to a single retry) and use that reply, emitting a recovery compression event"
    response: "src/adapters/sdk/anthropic.ts invoke() calls shouldRecover(outcome.applied, replyText); on true it appends a 'compression' event {recovered:true, fallbackReason:'auto_recovered'} and re-calls messages.create with the original persona.body + userMessage, replacing the reply — lossy compression becomes self-correcting at the cost of one retry"
    text: "When auto mode's compressed reply signals missing context, the system shall re-dispatch once with the original payload."
    test_refs: ["tests/adapters/anthropic.test.ts", "tests/optimizer/headroom.test.ts"]
  - id: AC-b9218d
    ears: unwanted
    condition: "if the native compression pass encounters any internal error"
    action: "return the original messages without throwing, recording fallbackReason='compute_error'"
    response: "src/optimizer/headroom.ts wraps compressNative() in try/catch; any error yields the original messages with applied=false — correctness never depends on compression succeeding, and the native pass itself is pure and side-effect-free"
    text: "If the native compression pass errors, then the system shall return the original messages without throwing."
    test_refs: ["tests/optimizer/headroom.test.ts"]
  - id: AC-00ac36
    ears: state
    condition: "while the estimated token count of the payload is below the configured minimum"
    action: "skip compression and return the original messages with fallbackReason='below_min_tokens'"
    response: "src/optimizer/headroom.ts approxTokens() heuristic gates against CLADDING_HEADROOM_MIN_TOKENS (default 1500); small payloads are not worth a compression pass so they pass through untouched"
    text: "While the payload is below the minimum token threshold, the system shall skip compression."
    test_refs: ["tests/optimizer/headroom.test.ts"]
  - id: AC-0bbaf3
    ears: ubiquitous
    action: "map each cladding context kind (logs, json, code, spec, history) to a compression posture"
    response: "src/optimizer/profiles.ts exports PROFILES: Record<ContextKind, config> where logs→aggressive target_ratio 0.25, json→dedup defaults, code→protect_analysis_context with conservative 0.6, spec→0.7 protect, history→0.4 keep-recent; each posture sets compress_user_messages / compress_system_messages / protect_recent / min_tokens_to_compress, which compress-native.ts isEligible() enforces"
    text: "The system shall map each context kind to a compression profile so each data type (logs, JSON, code, spec, history) is compressed appropriately."
    test_refs: ["tests/optimizer/headroom.test.ts"]
  - id: AC-93e942
    ears: event
    condition: "when compression is attempted (not disabled and above the min-token gate)"
    action: "append a compression event capturing tokensBefore, tokensAfter, transformsApplied, applied, and fallbackReason"
    response: "src/events/log.ts gains the 'compression' EventType; compressContext() callers emit it with the CompressOutcome payload so the observability persona and clad doctor can report realized savings and fallback rate"
    text: "When compression is attempted, the system shall append a compression event recording the before/after tokens and outcome."
    test_refs: ["tests/optimizer/headroom.test.ts"]
  - id: AC-e76e57
    ears: event
    condition: "when the Anthropic SDK adapter dispatches a persona turn"
    action: "route the assembled system and user payload through compressContext before calling messages.create, then send whichever messages are returned"
    response: "src/adapters/sdk/anthropic.ts invoke() calls compressContext([system, user], kind) between buildUserMessage() and messages.create(); it reads the returned system/user content (compressed or original) so a fallback is transparent to the API call and to drive/loop.ts"
    text: "When the Anthropic SDK adapter dispatches, the system shall route its payload through the compression seam before the API call."
    test_refs: ["tests/optimizer/headroom.test.ts"]
